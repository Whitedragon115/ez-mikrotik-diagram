services:
  app:
    build:
      context: .
      args:
        # public URL used in SEO metadata (canonical URL, share image); set APP_URL in .env
        APP_URL: "${APP_URL:-http://localhost:3000}"
    image: ez-mikrotik-diagram:latest
    container_name: ez-mikrotik-diagram
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      # SQLite database for saved configs, kept in the named volume below
      DATABASE_URL: file:/app/data/app.db
      # "Connect read-only" router import makes the server connect to whatever address it is given.
      # Fine on your own LAN, but keep it off if this instance is reachable from the Internet.
      ROUTER_IMPORT_ENABLED: "${ROUTER_IMPORT_ENABLED:-false}"
      # Discord login (needed to save configs). Values come from the .env file next to this compose file.
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      AUTH_SECRET: "${AUTH_SECRET:-}"
      # must match the URL you open in the browser, e.g. http://192.168.88.5:3000 or https://sim.example.com
      APP_URL: "${APP_URL:-http://localhost:3000}"
    volumes:
      - app-data:/app/data

volumes:
  app-data:
